# Authored for the ali-security fork: upstream log4j 1.2.17 ships no GitHub
# Actions CI. This mirrors the project's own build ("mvn package", see INSTALL)
# whose test phase runs the Ant regression suite tests/build.xml#runAll via
# maven-antrun-plugin.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated tests/build.xml target names (e.g. 'Core SocketServer'); empty runs the full runAll suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAVEN_VERSION: 3.6.3
      MAVEN_OPTS: -Dhttps.protocols=TLSv1.2 -Xmx1g
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 7 (source/target 1.4)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "7"

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          java -version
          mvn -v

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          FILTER="${{ inputs.test-filter }}"
          if [ -n "$FILTER" ]; then
            for t in $FILTER; do
              mvn -B clean verify -Dmaven.site.skip=true -Dlog4j.tests.target="$t" 2>&1 | tee -a build.log
            done
          else
            mvn -B clean verify -Dmaven.site.skip=true 2>&1 | tee build.log
          fi

      - name: Test summary
        if: always() && hashFiles('build.log') != ''
        shell: bash
        run: |
          echo "=== Per-suite results (Ant JUnit plain formatter) ==="
          # printsummary and the plain formatter each print a "Tests run:" line;
          # count only the formatter's one, which follows its "Testsuite:" line.
          awk '/\[junit\] Testsuite:/ {print; want=1; next} want && /\[junit\] Tests run:/ {print; want=0; line=$0; sub(/.*Tests run: /, "", line); split(line, a, /[^0-9]+/); r+=a[1]; f+=a[2]; e+=a[3]; n++} END {printf "TOTAL: %d suites, %d tests run, %d failures, %d errors, %d passed\n", n, r, f, e, r-f-e}' build.log

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: log4j-jar
          path: target/log4j-1.2.17.jar
          if-no-files-found: error
